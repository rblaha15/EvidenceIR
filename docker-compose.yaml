services:
  app:
    build: app
    restart: unless-stopped
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      PUBLIC_EMAIL_SENDER: ${PUBLIC_EMAIL_SENDER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE}
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST}
      EMAIL_IMAP_PORT: ${EMAIL_IMAP_PORT}
      EMAIL_IMAP_SECURE: ${EMAIL_IMAP_SECURE}
      FIREBASE_INFO: ${FIREBASE_INFO}
      GOSMS_CLIENT_ID: ${GOSMS_CLIENT_ID}
      GOSMS_CLIENT_SECRET: ${GOSMS_CLIENT_SECRET}
      GOSMS_CHANNEL_ID: ${GOSMS_CHANNEL_ID}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      MONGO_EXPRESS_HOSTNAME: ${MONGO_EXPRESS_HOSTNAME}
      NODE_ENV: ${PUBLIC_ENV}
      PUBLIC_ENV: ${PUBLIC_ENV}

      MONGO_URI: mongodb://mongo:27017
      ORIGIN: ${PUBLIC_APP_URL}
    depends_on:
      - mongo
    dns:
      - ${DNS}

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ./backend/mongo_data:/data/db

  nginx:
    image: nginx:1.26
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    networks:
      default:
      proxy:
        aliases:
          - "${NGINX_PROXY_NAME}"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"

      ME_CONFIG_BASICAUTH_ENABLED: "false"
      ME_CONFIG_BASICAUTH: "false"

      ME_CONFIG_SITE_BASEURL: /db/
      ME_CONFIG_SITE_COOKIESECRET: ${MONGO_EXPRESS_COOKIE_SECRET}
      ME_CONFIG_SITE_SESSIONSECRET: ${MONGO_EXPRESS_SESSION_SECRET}

      ME_CONFIG_REQUEST_SIZE: 10mb

    depends_on:
      - mongo

networks:
  proxy:
    external: true